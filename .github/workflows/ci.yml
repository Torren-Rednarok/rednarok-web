name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML (Nu HTML Checker)
        run: |
          docker run --rm -v "$PWD":/work validator/validator:latest \
            vnu --skip-non-html --Werror --format text /work
