name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML (W3C-style)
        uses: Cyb3r-Jak3/html5validator-action@v7
        with:
          root: .
